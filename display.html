<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PedePronto — Vitrine</title>
<style>
:root{
  --bg:#0a0a12;--sf:#12121e;--sf2:#1a1a2e;
  --tx:#f0f0ff;--t2:#8888aa;--t3:#555577;
  --ac:#6c63ff;--ac2:#4ecdc4;
  --gn:#2ecc71;--am:#f39c12;--rd:#e74c3c;
  --br:rgba(255,255,255,.07);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:'Segoe UI',system-ui,sans-serif}

/* ── VITRINE ── */
#vitrine{width:100%;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}

/* header */
#vt-header{display:flex;align-items:center;justify-content:space-between;padding:20px 32px 16px;background:linear-gradient(180deg,rgba(10,10,18,.98) 0%,transparent 100%);position:relative;z-index:2;flex-shrink:0}
#vt-logo-wrap{display:flex;align-items:center;gap:14px}
#vt-logo{width:52px;height:52px;border-radius:14px;object-fit:cover;display:none;border:2px solid var(--ac)}
#vt-brand{font-size:22px;font-weight:900;color:var(--ac);font-family:monospace;letter-spacing:-.5px}
#vt-nome{font-size:14px;color:var(--t2);margin-top:2px;font-weight:600}
#vt-clock{text-align:right}
#vt-time{font-size:36px;font-weight:900;font-family:monospace;color:var(--tx);letter-spacing:-1px}
#vt-date{font-size:13px;color:var(--t2);margin-top:2px}

/* background animado */
#vt-bg{position:absolute;inset:0;z-index:0;background:radial-gradient(ellipse at 20% 50%,rgba(108,99,255,.08) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(78,205,196,.06) 0%,transparent 50%),var(--bg)}
.vt-orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.25;animation:orbFloat 12s ease-in-out infinite}
.vt-orb:nth-child(1){width:300px;height:300px;background:var(--ac);top:-100px;left:10%;animation-delay:0s}
.vt-orb:nth-child(2){width:200px;height:200px;background:var(--ac2);bottom:10%;right:5%;animation-delay:-4s}
.vt-orb:nth-child(3){width:250px;height:250px;background:#e91e63;top:40%;left:60%;animation-delay:-8s}
@keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(20px,-30px) scale(1.05)}66%{transform:translate(-15px,20px) scale(.95)}}

/* conteúdo central */
#vt-content{flex:1;position:relative;z-index:1;overflow:hidden;padding:0 24px 16px}

/* ── MODO GRID (legacy) ── */
#vt-cats{display:flex;gap:10px;padding:0 0 14px;overflow-x:auto;scrollbar-width:none;flex-shrink:0;scroll-behavior:smooth}
#vt-cats::-webkit-scrollbar{display:none}
.vt-cat-chip{padding:8px 18px;border-radius:99px;border:1.5px solid var(--br);background:rgba(255,255,255,.04);color:var(--t2);font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap;backdrop-filter:blur(10px)}
.vt-cat-chip.on{background:var(--ac);border-color:var(--ac);color:#fff;box-shadow:0 4px 20px rgba(108,99,255,.4)}
#vt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;overflow-y:auto;height:100%;scrollbar-width:none;padding-bottom:20px;align-content:start}
#vt-grid::-webkit-scrollbar{display:none}
.vt-prod{background:rgba(255,255,255,.04);border:1px solid var(--br);border-radius:18px;padding:0;overflow:hidden;backdrop-filter:blur(12px);transition:transform .2s;animation:fadeInUp .4s both}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.vt-prod-foto{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--sf2)}
.vt-prod-foto-placeholder{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:48px;background:linear-gradient(135deg,var(--sf) 0%,var(--sf2) 100%)}
.vt-prod-info{padding:12px 14px 14px}
.vt-prod-nome{font-size:14px;font-weight:800;line-height:1.3;margin-bottom:4px;color:var(--tx)}
.vt-prod-desc{font-size:11px;color:var(--t2);line-height:1.4;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vt-prod-preco{font-size:18px;font-weight:900;color:var(--ac);font-family:monospace}

/* ── MODO CARROSSEL (totem) ── */
#vt-carousel{position:absolute;inset:0;z-index:1;display:none}
.car-slide{position:absolute;inset:0;opacity:0;transition:opacity .8s ease;display:flex;align-items:center;justify-content:center}
.car-slide.on{opacity:1;z-index:2}
.car-slide-img{width:100%;height:100%;object-fit:cover}
.car-slide-video{width:100%;height:100%;object-fit:cover}
.car-slide-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:120px;background:linear-gradient(135deg,var(--sf),var(--sf2))}
.car-slide-info{position:absolute;bottom:0;left:0;right:0;padding:40px 48px 48px;background:linear-gradient(0deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,.4) 60%,transparent 100%)}
.car-slide-cat{font-size:14px;font-weight:700;color:var(--ac2);text-transform:uppercase;letter-spacing:2px;margin-bottom:8px}
.car-slide-nome{font-size:36px;font-weight:900;color:#fff;margin-bottom:6px;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.car-slide-desc{font-size:16px;color:rgba(255,255,255,.7);margin-bottom:12px;max-width:600px;line-height:1.5}
.car-slide-preco{font-size:42px;font-weight:900;color:var(--ac);font-family:monospace;text-shadow:0 2px 20px rgba(108,99,255,.5)}
/* dots */
#car-dots{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:8px}
.car-dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.25);transition:all .3s}
.car-dot.on{background:var(--ac);width:28px;border-radius:5px;box-shadow:0 0 12px var(--ac)}

/* estado vazio */
#vt-empty{display:none;flex:1;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--t2)}

/* ── OVERLAY DE CHAMADA ── */
#call-overlay{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);animation:overlayIn .3s ease}
#call-overlay.on{display:flex}
@keyframes overlayIn{from{opacity:0}to{opacity:1}}
#call-card{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);border:2px solid var(--ac);border-radius:28px;padding:48px 56px;text-align:center;max-width:520px;width:90%;box-shadow:0 0 80px rgba(108,99,255,.5),0 30px 60px rgba(0,0,0,.6);animation:cardIn .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes cardIn{from{opacity:0;transform:scale(.7) translateY(40px)}to{opacity:1;transform:scale(1) translateY(0)}}
#call-icon{font-size:72px;display:block;margin-bottom:16px;animation:bellShake 1s ease .4s 3}
@keyframes bellShake{0%,100%{transform:rotate(0)}10%{transform:rotate(-15deg)}30%{transform:rotate(15deg)}50%{transform:rotate(-10deg)}70%{transform:rotate(10deg)}90%{transform:rotate(-5deg)}}
#call-label{font-size:18px;color:var(--t2);font-weight:700;text-transform:uppercase;letter-spacing:2px;margin-bottom:12px}
#call-num{font-size:88px;font-weight:900;font-family:monospace;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:8px;animation:numPulse 1.5s ease-in-out infinite}
@keyframes numPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.85;transform:scale(.97)}}
#call-nome{font-size:22px;font-weight:700;color:var(--tx);margin-bottom:6px}
#call-local{font-size:16px;color:var(--t2);margin-bottom:28px}
#call-sub{font-size:15px;color:var(--ac2);font-weight:800;text-transform:uppercase;letter-spacing:1.5px;padding:10px 24px;border:1.5px solid var(--ac2);border-radius:99px;display:inline-block}
#call-progress{height:4px;background:rgba(255,255,255,.1);border-radius:99px;margin-top:28px;overflow:hidden}
#call-progress-bar{height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:99px;width:100%;transition:width linear}

/* fila de espera */
#call-queue{position:fixed;bottom:24px;right:24px;z-index:99;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.call-q-item{background:rgba(108,99,255,.2);border:1px solid var(--ac);border-radius:12px;padding:8px 16px;font-size:14px;font-weight:800;color:var(--ac);backdrop-filter:blur(12px);animation:fadeInUp .3s both}

/* ── PLAYER BAR (Spotify / Audio) ── */
#music-bar{position:fixed;bottom:0;left:0;right:0;z-index:50;height:72px;background:linear-gradient(180deg,rgba(18,18,30,.95),rgba(10,10,18,.98));border-top:1px solid rgba(108,99,255,.15);backdrop-filter:blur(16px);display:none;align-items:center;padding:0 28px;gap:16px}
#music-bar.on{display:flex}
#mb-art{width:48px;height:48px;border-radius:8px;background:var(--sf2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden}
#mb-art img{width:100%;height:100%;object-fit:cover}
#mb-info{flex:1;min-width:0}
#mb-title{font-size:14px;font-weight:700;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mb-artist{font-size:11px;color:var(--t2);margin-top:2px}
#mb-controls{display:flex;align-items:center;gap:14px}
.mb-btn{width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.08);color:var(--tx);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.mb-btn:hover{background:rgba(255,255,255,.16)}
.mb-btn.play{width:42px;height:42px;background:var(--ac)}
#mb-progress{flex:2;display:flex;align-items:center;gap:10px;max-width:400px}
#mb-time-cur,#mb-time-dur{font-size:11px;color:var(--t3);font-family:monospace;min-width:36px;text-align:center}
#mb-bar{flex:1;height:4px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;cursor:pointer}
#mb-bar-fill{height:100%;background:var(--ac);border-radius:99px;width:0;transition:width .5s linear}
#mb-vol{display:flex;align-items:center;gap:6px}
#mb-vol-icon{color:var(--t2);font-size:16px}
#mb-vol-slider{width:80px;accent-color:var(--ac)}
/* ducking indicator */
#mb-duck{display:none;padding:4px 10px;border-radius:99px;background:rgba(108,99,255,.2);border:1px solid var(--ac);font-size:10px;font-weight:800;color:var(--ac);text-transform:uppercase;letter-spacing:1px;animation:duckPulse 1s infinite}
@keyframes duckPulse{0%,100%{opacity:1}50%{opacity:.5}}

/* Spotify embed */
#spotify-embed-wrap{position:fixed;bottom:80px;right:20px;z-index:49;width:320px;height:152px;border-radius:12px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.6);display:none}

/* rodapé */
#vt-footer{position:absolute;bottom:0;left:0;right:0;height:40px;background:linear-gradient(0deg,rgba(10,10,18,.98) 0%,transparent 100%);z-index:2;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
#vt-footer.has-music{bottom:72px}
#vt-footer-txt{font-size:11px;color:var(--t3);letter-spacing:1px}

/* botão ativar som */
#btn-ativar-som{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:300;background:var(--ac);color:#fff;border:none;border-radius:99px;padding:16px 32px;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 4px 30px rgba(108,99,255,.6);animation:btnPulse 2s ease-in-out infinite;letter-spacing:.5px;font-family:inherit}
#btn-ativar-som.oculto{display:none}
@keyframes btnPulse{0%,100%{box-shadow:0 4px 30px rgba(108,99,255,.6);transform:translateX(-50%) scale(1)}50%{box-shadow:0 4px 50px rgba(108,99,255,.9);transform:translateX(-50%) scale(1.04)}}
</style>
</head>
<body>

<div id="vitrine">
  <div id="vt-bg">
    <div class="vt-orb"></div>
    <div class="vt-orb"></div>
    <div class="vt-orb"></div>
  </div>

  <div id="vt-header">
    <div id="vt-logo-wrap">
      <img id="vt-logo" src="" alt="logo">
      <div>
        <div id="vt-brand">PedePronto</div>
        <div id="vt-nome">Carregando...</div>
      </div>
    </div>
    <div id="vt-clock">
      <div id="vt-time">00:00</div>
      <div id="vt-date"></div>
    </div>
  </div>

  <div id="vt-content">
    <div id="vt-cats"></div>
    <div id="vt-grid"></div>
    <!-- CARROSSEL TOTEM -->
    <div id="vt-carousel"></div>
    <div id="car-dots"></div>
    <div id="vt-empty">
      <div style="font-size:48px">🍽️</div>
      <div style="font-size:18px;font-weight:700">Cardápio em breve</div>
      <div style="font-size:13px;margin-top:4px">Nenhum produto cadastrado ainda</div>
    </div>
  </div>

  <div id="vt-footer">
    <div id="vt-footer-txt">PedePronto PDV • Retire seu pedido no balcão</div>
  </div>
</div>

<!-- OVERLAY DE CHAMADA -->
<div id="call-overlay">
  <div id="call-card">
    <span id="call-icon">🔔</span>
    <div id="call-label">Pedido Pronto!</div>
    <div id="call-num">#001</div>
    <div id="call-nome"></div>
    <div id="call-local"></div>
    <div id="call-sub">Retire no balcão</div>
    <div id="call-progress"><div id="call-progress-bar"></div></div>
  </div>
</div>

<!-- FILA DE PRÓXIMOS -->
<div id="call-queue"></div>

<!-- PLAYER BAR -->
<div id="music-bar">
  <div id="mb-art">🎵</div>
  <div id="mb-info">
    <div id="mb-title">Nenhuma música</div>
    <div id="mb-artist">—</div>
  </div>
  <div id="mb-controls">
    <button class="mb-btn play" id="mb-play" onclick="_toggleMusic()">▶</button>
  </div>
  <div id="mb-progress">
    <span id="mb-time-cur">0:00</span>
    <div id="mb-bar" onclick="_seekMusic(event)"><div id="mb-bar-fill"></div></div>
    <span id="mb-time-dur">0:00</span>
  </div>
  <div id="mb-vol">
    <span id="mb-vol-icon">🔊</span>
    <input type="range" id="mb-vol-slider" min="0" max="1" step="0.05" value="0.6" oninput="_setMusicVol(this.value)">
  </div>
  <div id="mb-duck">ANUNCIANDO</div>
</div>

<!-- SPOTIFY EMBED -->
<div id="spotify-embed-wrap"></div>

<!-- BOTÃO ATIVAR SOM -->
<button id="btn-ativar-som" onclick="_ativarAudio()" title="Clique para ativar som e voz">
  🔊 Toque para ativar o som
</button>

<!-- AUDIO ELEMENT -->
<audio id="bg-music" loop preload="auto"></audio>

<script>
window.PP_VERSION='2.2.0';
// ── Auto-update: verifica nova versão a cada 5 min ──
if(location.protocol==='https:'){
  setInterval(function(){
    fetch('/display.html?_t='+Date.now(),{cache:'no-store'}).then(function(r){return r.text();}).then(function(html){
      var m=html.match(/PP_VERSION='([^']+)'/);
      if(m&&m[1]&&m[1]!==window.PP_VERSION) location.reload(true);
    }).catch(function(){});
  },5*60*1000);
}
// ═══════════════════════════════════════════
//  DADOS
// ═══════════════════════════════════════════
const PREFIX='pedepronto_';
function load(k){try{return JSON.parse(localStorage.getItem(PREFIX+k))||null}catch(e){return null}}

let _produtos=[];
let _categorias=[];
let _cfg={};
let _catAtiva='todos';
let _callQueue=[];
let _callTimer=null;
let _autoScrollInterval=null;

// ═══════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════
function init(){
  _cfg=load('cfg')||{};
  _produtos=load('produtos')||[];
  _categorias=load('categorias')||[];
  renderHeader();
  _initDisplay(); // escolhe modo: grid ou carrossel
  startClock();
  listenCalls();
  _carregarVozes();
  _initMusic();
}

// ═══════════════════════════════════════════
//  HEADER
// ═══════════════════════════════════════════
function renderHeader(){
  const logo=document.getElementById('vt-logo');
  if(_cfg.logo){logo.src=_cfg.logo;logo.style.display='block';}
  document.getElementById('vt-brand').textContent=(_cfg.nome||'PedePronto');
  document.getElementById('vt-nome').textContent=_cfg.slogan||'Faça seu pedido no balcão';
  document.getElementById('vt-footer-txt').textContent='PedePronto • '+(_cfg.nome||'')+((_cfg.end)?' — '+_cfg.end:'');
}

// ═══════════════════════════════════════════
//  RELÓGIO
// ═══════════════════════════════════════════
function startClock(){
  function tick(){
    const now=new Date();
    const h=String(now.getHours()).padStart(2,'0');
    const m=String(now.getMinutes()).padStart(2,'0');
    document.getElementById('vt-time').textContent=h+':'+m;
    const dias=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
    const meses=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
    document.getElementById('vt-date').textContent=dias[now.getDay()]+', '+now.getDate()+' de '+meses[now.getMonth()];
  }
  tick();setInterval(tick,30000);
}

// ═══════════════════════════════════════════
//  DISPLAY MODE: Grid ou Carrossel
// ═══════════════════════════════════════════
function _initDisplay(){
  const modo=_cfg.vitrine_modo||'grid';
  if(modo==='carousel'){
    document.getElementById('vt-cats').style.display='none';
    document.getElementById('vt-grid').style.display='none';
    document.getElementById('vt-carousel').style.display='block';
    document.getElementById('car-dots').style.display='flex';
    _buildCarousel();
    _startCarousel();
  }else{
    document.getElementById('vt-carousel').style.display='none';
    document.getElementById('car-dots').style.display='none';
    renderCats();
    renderGrid();
    startAutoScroll();
  }
}

// ═══════════════════════════════════════════
//  MODO GRID (legacy)
// ═══════════════════════════════════════════
function renderCats(){
  const catsUsadas=[...new Set(_produtos.filter(p=>p.ativo!==false).map(p=>p.categoria||'Geral'))];
  const el=document.getElementById('vt-cats');
  if(catsUsadas.length<=1){el.style.display='none';return;}
  el.style.display='flex';
  const chips=[{id:'todos',nome:'Tudo'},..._categorias.filter(c=>catsUsadas.includes(c.nome)).map(c=>({id:c.nome,nome:c.nome})),...catsUsadas.filter(n=>!_categorias.find(c=>c.nome===n)).map(n=>({id:n,nome:n}))];
  el.innerHTML=chips.map(c=>`<button class="vt-cat-chip${_catAtiva===c.id?' on':''}" onclick="setCategoria('${c.id.replace(/'/g,'\\\'')}')">${c.nome}</button>`).join('');
}
function setCategoria(id){_catAtiva=id;renderCats();renderGrid();}

function renderGrid(){
  const prods=_produtos.filter(p=>p.ativo!==false&&(_catAtiva==='todos'||p.categoria===_catAtiva));
  const grid=document.getElementById('vt-grid');
  const empty=document.getElementById('vt-empty');
  if(!prods.length){grid.style.display='none';empty.style.display='flex';return;}
  grid.style.display='grid';empty.style.display='none';
  function fmtR(v){return'R$ '+Number(v||0).toFixed(2).replace('.',',');}
  grid.innerHTML=prods.map((p,i)=>`
    <div class="vt-prod" style="animation-delay:${i*0.04}s">
      ${p.foto?`<img class="vt-prod-foto" src="${p.foto}" alt="${p.nome}" loading="lazy">`:`<div class="vt-prod-foto-placeholder">${p.icon||'🍽️'}</div>`}
      <div class="vt-prod-info">
        <div class="vt-prod-nome">${p.nome}</div>
        ${p.desc?`<div class="vt-prod-desc">${p.desc}</div>`:''}
        <div class="vt-prod-preco">${fmtR(p.preco)}</div>
      </div>
    </div>`).join('');
}

function startAutoScroll(){
  const grid=document.getElementById('vt-grid');
  let dir=1;let paused=false;
  _autoScrollInterval=setInterval(()=>{
    if(paused)return;
    grid.scrollTop+=dir*2;
    if(grid.scrollTop+grid.clientHeight>=grid.scrollHeight-10){paused=true;setTimeout(()=>{dir=-1;paused=false;},3000);}
    if(grid.scrollTop<=0&&dir===-1){paused=true;setTimeout(()=>{dir=1;paused=false;},2000);}
  },60);
}

// ═══════════════════════════════════════════
//  MODO CARROSSEL — TOTEM
// ═══════════════════════════════════════════
let _carSlides=[];
let _carIdx=0;
let _carTimer=null;
let _carPaused=false;

function fmtR(v){return'R$ '+Number(v||0).toFixed(2).replace('.',',');}

function _buildCarousel(){
  const prods=_produtos.filter(p=>p.ativo!==false);
  const videos=(_cfg.vitrine_videos||[]);
  _carSlides=[];

  // Intercala produtos e videos
  const vidInterval=Math.max(3,Math.floor(prods.length/(videos.length||1)));
  let vidIdx=0;
  prods.forEach((p,i)=>{
    _carSlides.push({type:'product',data:p});
    // Insere video a cada N produtos
    if(videos.length>0&&(i+1)%vidInterval===0&&vidIdx<videos.length){
      _carSlides.push({type:'video',data:videos[vidIdx]});
      vidIdx++;
    }
  });
  // Adiciona videos restantes ao final
  for(;vidIdx<videos.length;vidIdx++){
    _carSlides.push({type:'video',data:videos[vidIdx]});
  }

  if(!_carSlides.length){
    document.getElementById('vt-empty').style.display='flex';
    return;
  }

  const container=document.getElementById('vt-carousel');
  const dots=document.getElementById('car-dots');

  container.innerHTML=_carSlides.map((s,i)=>{
    if(s.type==='video'){
      return `<div class="car-slide${i===0?' on':''}">
        <video class="car-slide-video" src="${s.data.url}" autoplay muted loop playsinline></video>
        <div class="car-slide-info">
          <div class="car-slide-cat">PROMOÇÃO</div>
          <div class="car-slide-nome">${_esc(s.data.titulo||'Video Promocional')}</div>
        </div>
      </div>`;
    }
    const p=s.data;
    return `<div class="car-slide${i===0?' on':''}">
      ${p.foto?`<img class="car-slide-img" src="${p.foto}" alt="${_esc(p.nome)}">`:`<div class="car-slide-placeholder">${p.icon||'🍽️'}</div>`}
      <div class="car-slide-info">
        <div class="car-slide-cat">${_esc(p.categoria||'Destaque')}</div>
        <div class="car-slide-nome">${_esc(p.nome)}</div>
        ${p.desc?`<div class="car-slide-desc">${_esc(p.desc)}</div>`:''}
        <div class="car-slide-preco">${fmtR(p.preco)}</div>
      </div>
    </div>`;
  }).join('');

  dots.innerHTML=_carSlides.map((_,i)=>`<div class="car-dot${i===0?' on':''}" onclick="_carGoTo(${i})"></div>`).join('');
}

function _esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function _startCarousel(){
  if(!_carSlides.length)return;
  const dur=(_cfg.vitrine_duracao||6)*1000;
  _carTimer=setInterval(()=>{
    if(_carPaused)return;
    _carGoTo((_carIdx+1)%_carSlides.length);
  },dur);
}

function _carGoTo(idx){
  _carIdx=idx;
  const slides=document.querySelectorAll('.car-slide');
  const dots=document.querySelectorAll('.car-dot');
  slides.forEach((s,i)=>s.classList.toggle('on',i===idx));
  dots.forEach((d,i)=>d.classList.toggle('on',i===idx));
  // Pause/play videos accordingly
  slides.forEach((s,i)=>{
    const vid=s.querySelector('video');
    if(vid){if(i===idx){vid.currentTime=0;vid.play();}else vid.pause();}
  });
}

function _carouselPause(){_carPaused=true;}
function _carouselResume(){_carPaused=false;}

// ═══════════════════════════════════════════
//  SISTEMA DE CHAMADAS
// ═══════════════════════════════════════════
function listenCalls(){
  try{const bc=new BroadcastChannel('pp_display');bc.onmessage=e=>{if(e.data&&e.data.type==='call')enqueueCall(e.data);};}catch(err){}
  window.addEventListener('storage',e=>{
    if(e.key==='pp_display_call'&&e.newValue){try{enqueueCall(JSON.parse(e.newValue));}catch(ex){}}
  });
}

function enqueueCall(data){
  if(_callQueue.find(c=>c.ts===data.ts))return;
  _callQueue.push(data);
  renderQueue();
  if(!_callTimer)showNextCall();
}

function renderQueue(){
  const el=document.getElementById('call-queue');
  const espera=_callQueue.slice(1);
  el.innerHTML=espera.length?espera.map(c=>`<div class="call-q-item">🔔 #${c.num}${c.nome?' — '+c.nome:''}</div>`).join(''):'';
}

// ═══════════════════════════════════════════
//  VOZ + AUDIO DUCKING
// ═══════════════════════════════════════════
let _audioUnlocked=false;
let _vozes=[];
let _musicDucked=false;

function _carregarVozes(){
  if(!window.speechSynthesis)return;
  const fn=()=>{_vozes=speechSynthesis.getVoices();};
  fn();speechSynthesis.onvoiceschanged=fn;
  setTimeout(fn,500);setTimeout(fn,1500);setTimeout(fn,3000);
}

function _ativarAudio(){
  _audioUnlocked=true;
  try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;u.lang='pt-BR';speechSynthesis.speak(u);}catch(e){}
  try{new(window.AudioContext||window.webkitAudioContext)();}catch(e){}
  document.getElementById('btn-ativar-som').classList.add('oculto');
  // Start music if configured
  const audio=document.getElementById('bg-music');
  if(audio&&audio.src&&audio.paused)audio.play().catch(()=>{});
}

function _selecionarVoz(lang){
  if(!_vozes.length)_vozes=speechSynthesis.getVoices();
  const exato=_vozes.filter(v=>v.lang===lang);
  if(exato.length)return exato[0];
  const base=_vozes.filter(v=>v.lang.startsWith('pt'));
  return base[0]||_vozes[0]||null;
}

function _criarUtterance(txt){
  const u=new SpeechSynthesisUtterance(txt);
  u.lang='pt-BR';u.rate=0.92;u.pitch=1.05;u.volume=1;
  const voz=_selecionarVoz('pt-BR');
  if(voz)u.voice=voz;
  return u;
}

function falarChamada(data,onDone){
  if(!window.speechSynthesis||!_audioUnlocked){if(onDone)onDone();return;}
  const estab=(_cfg.nome||'PedePronto').replace(/[^\w\sÀ-ÿ]/g,'').trim();
  const num='número '+String(data.num).replace('#','');
  const nome=data.nome||'';
  const localTxt={mesa:'Dirija-se à sua mesa.',balcao:'Retire no balcão.',delivery:'Seu pedido está pronto.'}[data.tipo]||'Retire no balcão.';
  const txt=nome
    ?`Atenção! ${nome}, seu pedido ${num} está pronto no ${estab}. ${localTxt}`
    :`Atenção! Pedido ${num} está pronto no ${estab}. ${localTxt}`;
  speechSynthesis.cancel();
  setTimeout(()=>{
    const utt=_criarUtterance(txt);
    utt.onend=()=>{
      // Repete uma vez
      setTimeout(()=>{
        speechSynthesis.cancel();
        const utt2=_criarUtterance(txt);
        utt2.onend=()=>{if(onDone)onDone();};
        setTimeout(()=>speechSynthesis.speak(utt2),200);
      },800);
    };
    speechSynthesis.speak(utt);
  },250);
}

// ── Audio Ducking ──
function _duckMusic(cb){
  const audio=document.getElementById('bg-music');
  const duck=document.getElementById('mb-duck');
  if(duck)duck.style.display='inline-block';
  _musicDucked=true;
  if(audio&&!audio.paused){
    const mus=_cfg.vitrine_musica||{};
    const target=mus.duck_volume||0.05;
    const dur=mus.fade_ms||800;
    _fadeAudio(audio,audio.volume,target,dur,cb);
  }else{
    // Also mute spotify embed
    const iframe=document.getElementById('spotify-embed-wrap');
    if(iframe)iframe.style.opacity='0.3';
    if(cb)setTimeout(cb,200);
  }
}

function _unduckMusic(){
  const audio=document.getElementById('bg-music');
  const duck=document.getElementById('mb-duck');
  if(duck)duck.style.display='none';
  _musicDucked=false;
  if(audio&&!audio.paused){
    const mus=_cfg.vitrine_musica||{};
    const target=mus.volume||0.6;
    _fadeAudio(audio,audio.volume,target,1200);
  }
  const iframe=document.getElementById('spotify-embed-wrap');
  if(iframe)iframe.style.opacity='1';
}

function _fadeAudio(audio,from,to,dur,cb){
  const steps=20;
  const stepDur=dur/steps;
  const delta=(to-from)/steps;
  let i=0;
  const iv=setInterval(()=>{
    i++;
    audio.volume=Math.max(0,Math.min(1,from+delta*i));
    if(i>=steps){clearInterval(iv);if(cb)cb();}
  },stepDur);
}

// ═══════════════════════════════════════════
//  SHOW CALL — com ducking + pause carrossel
// ═══════════════════════════════════════════
function showNextCall(){
  if(!_callQueue.length){renderQueue();return;}
  const data=_callQueue[0];
  renderQueue();

  // 1. Pause carrossel
  _carouselPause();

  // 2. Duck music
  _duckMusic(()=>{
    // 3. Show overlay
    const overlay=document.getElementById('call-overlay');
    document.getElementById('call-num').textContent='#'+String(data.num).padStart(3,'0');
    document.getElementById('call-nome').textContent=data.nome||'';
    const localMap={mesa:'🪑 '+(data.mesa||'Mesa'),balcao:'🧾 Retire no Balcão',delivery:'🛵 Delivery'};
    document.getElementById('call-local').textContent=localMap[data.tipo]||'🧾 Retire no Balcão';
    document.getElementById('call-icon').textContent='🔔';

    const bar=document.getElementById('call-progress-bar');
    bar.style.transition='none';bar.style.width='100%';
    overlay.classList.add('on');

    // Bipes
    try{
      const ctx=new(window.AudioContext||window.webkitAudioContext)();
      [0,300,600].forEach(d=>{
        setTimeout(()=>{
          const o=ctx.createOscillator();const g=ctx.createGain();
          o.connect(g);g.connect(ctx.destination);
          o.frequency.value=880;g.gain.setValueAtTime(0,ctx.currentTime);
          g.gain.linearRampToValueAtTime(.3,ctx.currentTime+.05);
          g.gain.linearRampToValueAtTime(0,ctx.currentTime+.3);
          o.start();o.stop(ctx.currentTime+.35);
        },d);
      });
    }catch(e){}

    // 4. TTS após bipes
    setTimeout(()=>falarChamada(data,()=>{
      // TTS done — unduck will happen when overlay closes
    }),1100);

    const dur=15000;
    setTimeout(()=>{bar.style.transition=`width ${dur}ms linear`;bar.style.width='0%';},50);

    _callTimer=setTimeout(()=>{
      overlay.classList.remove('on');
      _callQueue.shift();
      _callTimer=null;
      // 5. Unduck + resume
      _unduckMusic();
      _carouselResume();
      setTimeout(()=>{if(_callQueue.length)showNextCall();else renderQueue();},400);
    },dur);
  });
}

// ═══════════════════════════════════════════
//  MUSIC PLAYER
// ═══════════════════════════════════════════
let _musicPlaying=false;

function _initMusic(){
  const mus=_cfg.vitrine_musica||{};
  if(!mus.tipo||mus.tipo==='off')return;

  const bar=document.getElementById('music-bar');
  const footer=document.getElementById('vt-footer');

  if(mus.tipo==='url'&&mus.url){
    const audio=document.getElementById('bg-music');
    audio.src=mus.url;
    audio.volume=mus.volume||0.6;
    bar.classList.add('on');
    footer.classList.add('has-music');
    document.getElementById('mb-title').textContent='Música Ambiente';
    document.getElementById('mb-artist').textContent=_cfg.nome||'PedePronto';

    // Progress update
    audio.addEventListener('timeupdate',()=>{
      if(!audio.duration)return;
      const pct=(audio.currentTime/audio.duration)*100;
      document.getElementById('mb-bar-fill').style.width=pct+'%';
      document.getElementById('mb-time-cur').textContent=_fmtTime(audio.currentTime);
      document.getElementById('mb-time-dur').textContent=_fmtTime(audio.duration);
    });

    // Auto-play when unlocked
    audio.addEventListener('canplay',()=>{
      if(_audioUnlocked&&audio.paused)audio.play().catch(()=>{});
    },{once:true});
  }

  if(mus.tipo==='spotify'&&mus.spotify_url){
    // Extract playlist ID from URL
    const match=mus.spotify_url.match(/playlist\/([a-zA-Z0-9]+)/);
    if(match){
      const playlistId=match[1];
      const wrap=document.getElementById('spotify-embed-wrap');
      wrap.style.display='block';
      wrap.innerHTML=`<iframe style="border-radius:12px" src="https://open.spotify.com/embed/playlist/${playlistId}?utm_source=generator&theme=0" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>`;
      // Show player bar with Spotify info
      bar.classList.add('on');
      footer.classList.add('has-music');
      document.getElementById('mb-title').textContent='Spotify Playlist';
      document.getElementById('mb-artist').textContent='Reproduzindo via Spotify';
      document.getElementById('mb-art').innerHTML='🎧';
    }
  }
}

function _toggleMusic(){
  const audio=document.getElementById('bg-music');
  if(!audio||!audio.src)return;
  if(audio.paused){audio.play();_musicPlaying=true;document.getElementById('mb-play').textContent='⏸';}
  else{audio.pause();_musicPlaying=false;document.getElementById('mb-play').textContent='▶';}
}

function _setMusicVol(v){
  const audio=document.getElementById('bg-music');
  if(audio)audio.volume=parseFloat(v);
}

function _seekMusic(e){
  const audio=document.getElementById('bg-music');
  if(!audio||!audio.duration)return;
  const bar=document.getElementById('mb-bar');
  const rect=bar.getBoundingClientRect();
  const pct=(e.clientX-rect.left)/rect.width;
  audio.currentTime=pct*audio.duration;
}

function _fmtTime(s){
  const m=Math.floor(s/60);
  const sec=Math.floor(s%60);
  return m+':'+String(sec).padStart(2,'0');
}

// ═══════════════════════════════════════════
//  ATUALIZA DADOS PERIODICAMENTE
// ═══════════════════════════════════════════
setInterval(()=>{
  _produtos=load('produtos')||[];
  _categorias=load('categorias')||[];
  const oldModo=_cfg.vitrine_modo;
  _cfg=load('cfg')||{};
  renderHeader();
  if((_cfg.vitrine_modo||'grid')!==oldModo){
    // Modo mudou — reinicializa
    if(_carTimer){clearInterval(_carTimer);_carTimer=null;}
    if(_autoScrollInterval){clearInterval(_autoScrollInterval);_autoScrollInterval=null;}
    _initDisplay();
  }else if(_cfg.vitrine_modo==='carousel'){
    _buildCarousel();
  }else{
    renderCats();
    renderGrid();
  }
},30000);

init();
